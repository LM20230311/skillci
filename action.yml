name: SkillCI Audit
description: Audit AI agent skills, enforce policies, and flag risky changes in CI.
author: SkillCI contributors
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Skill or repository path to audit.
    required: false
    default: .
  policy:
    description: Optional path to a SkillCI policy file.
    required: false
    default: ""
  base-policy:
    description: Optional checked-out baseline policy; permission expansions are annotated against this file.
    required: false
    default: ""
  fail-on-risk:
    description: Fail when high or critical findings are present.
    required: false
    default: "true"
  sarif-output:
    description: Optional SARIF output file, relative to the working directory. Upload separately with upload-sarif.
    required: false
    default: ""
outputs:
  sarif-file:
    description: Requested SARIF file path (only written when sarif-output is set and scanning succeeds).
    value: ${{ inputs.sarif-output }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SKILLCI_PATH: ${{ inputs.path }}
        SKILLCI_POLICY: ${{ inputs.policy }}
        SKILLCI_BASE_POLICY: ${{ inputs.base-policy }}
        SKILLCI_FAIL: ${{ inputs.fail-on-risk }}
        SKILLCI_SARIF: ${{ inputs.sarif-output }}
      run: |
        policy_args=()
        if [ -n "$SKILLCI_POLICY" ]; then
          policy_args=(--policy "$SKILLCI_POLICY")
        fi
        if [ -n "$SKILLCI_BASE_POLICY" ] && [ -n "$SKILLCI_POLICY" ]; then
          node "$GITHUB_ACTION_PATH/dist/action/index.cjs" policy diff "$SKILLCI_BASE_POLICY" "$SKILLCI_POLICY" --format github
        fi
        if [ -n "$SKILLCI_SARIF" ]; then
          node "$GITHUB_ACTION_PATH/dist/action/index.cjs" audit "$SKILLCI_PATH" "${policy_args[@]}" --format sarif --source-root "$GITHUB_WORKSPACE" --output "$SKILLCI_SARIF" --no-fail
        fi
        if [ "$SKILLCI_FAIL" = "true" ]; then
          node "$GITHUB_ACTION_PATH/dist/action/index.cjs" audit "$SKILLCI_PATH" "${policy_args[@]}" --format github
        else
          node "$GITHUB_ACTION_PATH/dist/action/index.cjs" audit "$SKILLCI_PATH" "${policy_args[@]}" --format github --no-fail
        fi
